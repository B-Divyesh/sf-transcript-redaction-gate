[package]
name = "transcript-redaction-gate"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Offline, deterministic secret redaction for terminal and JSONL transcripts"
repository = "https://github.com/B-Divyesh/sf-transcript-redaction-gate"
readme = "../../README.md"
keywords = ["redaction", "secrets", "cli", "transcript", "privacy"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "transcript_redaction_gate"
path = "src/lib.rs"

[[bin]]
name = "trg"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.46", features = ["derive"] }
regex = "1.11.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.21.0"

